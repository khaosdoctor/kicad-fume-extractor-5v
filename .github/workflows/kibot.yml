name: KiBot

on:
  push:
    branches: [main]
  pull_request:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate outputs with KiBot
        uses: INTI-CMNB/KiBot@v2_k10
        with:
          config: kibot.yaml
          dir: output
          board: 'fume Extractor.kicad_pcb'
          schema: 'fume Extractor.kicad_sch'

      - name: Upload outputs
        uses: actions/upload-artifact@v4
        with:
          name: kibot-outputs
          path: output
